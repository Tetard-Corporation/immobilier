  # --- Cœur alpin du set (1er septembre) -----------------------------------------
  # Les six agences ci-dessous comblent le trou mesuré : la base ne contenait AUCUN
  # bien d'agence en Isère, en Haute-Savoie ni dans les Hautes-Alpes — c'est-à-dire
  # dans la majorité des massifs que le set vise (Oisans, Vercors, Trièves, Maurienne,
  # Beaufortain, Dévoluy). Les agences existantes couvraient 01, 26, 73-Bauges, plus
  # 07/42/43 qui sont à l'ouest de l'axe Lyon-Valence.
  # Toutes sondées par `scripts/probe_agence.py` : voie D, 6 biens sur 6 avec commune.
  # `departements` est la zone RÉELLE de l'agence, pas celle du set : c'est ce champ
  # qui écarte les biens qu'un lien de rubrique ramènerait d'ailleurs.
  - nom: "Immobilière Olivier"    # Oisans : Bourg-d'Oisans, Allemond, Vaujany, Ornon (38)
    set_ids: [1]
    departements: [38]
    sites:
