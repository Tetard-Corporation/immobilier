# Agences locales (hors portails) scrapées via parsers dédiés (Voie B).
# Ajouter une agence : un parser dans app/services/agences_parsers.py + ses URLs ici.
# Les photos sont garanties par _enrich_from_detail (og:image) même si la carte n'en a pas.
agences:
  - nom: "Agence Cévenole"        # plateau Vivarais-Lignon / nord-Ardèche (07/43)
    sites:
      - https://www.agencecevenole.com/ventes-fermes-et-maisons-en-pierres-w1
  - nom: "Bauges Immobilier"      # massif des Bauges (Savoie 73)
    sites:
      - https://bauges-immobilier.com/fr/ventes
  - nom: "Christine Miranda"      # Drôme provençale / Baronnies (26) - biens de caractère
    sites:
      - https://www.christinemiranda.com/
  - nom: "Kreisker Immobilier"    # baie de Morlaix (29) : Locquirec, Plougasnou, Plouezoc'h
    # Site sans JSON-LD sur la liste mais avec un JSON-LD propre par fiche : c'est la
    # voie générique (harvest_detail_links) qui le traite, sans parser dédié.
    set_id: 4
    sites:
      - https://www.kreisker-immo.fr/vente/1
