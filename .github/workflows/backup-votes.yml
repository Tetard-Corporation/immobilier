name: Sauvegarde des votes Supabase

# Sauvegarde quotidienne (+ manuelle) de la table `votes` dans data/votes_backup.json,
# committée dans le dépôt. Garantit que les votes/commentaires ne sont jamais perdus
# même si le projet Supabase est mis en pause, supprimé ou recréé.
# Restauration : `python backend/scripts/restore_votes.py` (voir docs/OPERATIONS.md).

on:
  schedule:
    - cron: "17 4 * * *"   # tous les jours à 04:17 UTC
  workflow_dispatch: {}      # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write            # pour committer le dump mis à jour

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dump de la table votes
        run: python backend/scripts/backup_votes.py

      - name: Commit si changement
        run: |
          if [ -n "$(git status --porcelain data/votes_backup.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/votes_backup.json
            git commit -m "backup: votes Supabase ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Aucun changement dans les votes — rien à committer."
          fi
